<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DQF-Framework – Welcome / Willkommen</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
            color: #1f2328;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .welcome-card {
            background: #ffffff;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid #d0d7de;
        }
        h1 {
            color: #0969da;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #57606a;
            margin-bottom: 2rem;
            font-size: 1rem;
        }
        .lang-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        .lang-btn {
            background-color: #f6f8fa;
            border: 1px solid #d0d7de;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            color: #24292f;
            text-decoration: none;
            transition: all 0.2s ease;
            flex: 1;
        }
        .lang-btn:hover {
            background-color: #0969da;
            color: white;
            border-color: #0969da;
        }
        .creators {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #8c959f;
            border-top: 1px solid #eaecef;
            padding-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <h1>DQF-Framework</h1>
        <p>Please select your preferred language / Bitte wähle deine bevorzugte Sprache</p>
        
        <div class="lang-buttons">
            <a href="de.html" class="lang-btn">Deutsch 🇩🇪</a>
            <a href="en.html" class="lang-btn">English 🇬🇧</a>
        </div>

        <div class="creators">
            Charalabos Avgitidis & Aether
        </div>
    </div>
</body>
</html>
