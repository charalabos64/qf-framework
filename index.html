<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Das DQF-Framework | Forschungsarchiv</title>
    <style>
        :root {
            --bg-deep: #050811;
            --bg-main: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.75);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --border: #1e293b;
            --code-bg: #030712;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.8;
            margin: 0;
            padding: 0;
        }

        /* Top Bar / Sprachwahl */
        .top-bar {
            background: var(--bg-deep);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 2rem;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            font-size: 0.9rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .lang-switch span {
            color: var(--text-muted);
            margin-right: 0.5rem;
        }

        .lang-switch a {
            color: var(--accent);
            text-decoration: none;
            padding: 0.25rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            margin-left: 0.25rem;
            transition: all 0.2s ease;
        }

        .lang-switch a:hover {
            background: var(--accent-glow);
            border-color: var(--accent);
        }

        /* Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        /* Header */
        header {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(11, 15, 25, 0) 100%);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 3rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.4rem;
            color: #ffffff;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--accent);
            font-size: 1.2rem;
            font-weight: 400;
        }

        /* Content Boxes */
        .box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            padding: 2.5rem;
            margin: 2rem 0;
            border-radius: 0 10px 10px 0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
        }

        h2 {
            color: #f8fafc;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        p strong {
            color: var(--text-main);
        }

        /* Math Display */
        .math {
            background: var(--code-bg);
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 1.25rem;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 6px;
            margin: 1.25rem 0;
            overflow-x: auto;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Divider */
        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 5rem 0;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 3rem 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            margin-top: 4rem;
        }
    </style>
</head>
